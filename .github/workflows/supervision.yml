name: Supervision

on:
  schedule:
    - cron: "7,37 * * * *"        # secours ; déclencheur principal : Worker Cloudflare (cloudflare/worker.js), toutes les 15 min
  workflow_dispatch:
    inputs:
      heartbeat:                  # rempli par les jobs hors GitHub (VPS), voir README
        description: "Heartbeat JSON (laisser vide pour une vérification simple)"
        required: false
        default: ""

permissions:
  contents: write

# Pas de groupe « concurrency » : GitHub n'y garde qu'un run en attente et annulerait
# un heartbeat arrivé en même temps qu'une vérification planifiée. Les conflits d'écriture
# sont gérés par la boucle ci-dessous (repartir de origin/main et recalculer).

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Vérification et commit des données
        env:
          GH_TOKEN: ${{ secrets.SUPERVISION_TOKEN }}
          HEARTBEAT: ${{ inputs.heartbeat }}
        run: |
          git config user.name "supervision-bot"
          git config user.email "supervision-bot@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$HEARTBEAT" ]; then
              python supervise.py --heartbeat "$HEARTBEAT"
            else
              python supervise.py
            fi
            git add docs/data
            git diff --cached --quiet && exit 0
            git commit -q -m "données de supervision $(date -u +%FT%TZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
